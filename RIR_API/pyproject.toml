[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"


[project]
name = "rir-api"
version = "1.0.0"
description = "API REST para procesamiento y analisis de respuestas al impulso segun ISO 3382"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"

authors = [
    { name = "Francisco Gil Frias", email = "gil50070@estudiantes.untref.edu.ar" },
    { name = "Matias Moreira", email = "matmore83@hotmail.com" },
    { name = "Mora Sawczyk", email = "morasawczyk@gmail.com" },
]

dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "pydantic-settings",
    "numpy",
    "scipy",
    "matplotlib",
    "soundfile",
    "sounddevice",
    "python-multipart",
    "marimo",
    "pytest",
]


[project.optional-dependencies]
dev = [
    "pytest",
    "httpx",
    "ruff",
    "pytest-cov",
]


[tool.setuptools.packages.find]
include = ["app*"]
exclude = [
    "tests*",
    "docs*",
    "docs_*",
]


[tool.ruff]
line-length = 100
target-version = "py312"


[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]


[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest-cov>=7.1.0",
]
